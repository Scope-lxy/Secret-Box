name: secretbox

services:
  api:
    container_name: secretbox-api
    image: secretbox-api:2026.09.17-01
    build:
      context: /opt/secretbox/app
      dockerfile: secretbox.Dockerfile
    env_file:
      - /opt/secretbox/runtime.env
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      MINIAPP_DATA_DIR: /app/data
      MINIPROGRAM_SOURCE_DIR: /app/miniprogram
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
    ports:
      - 127.0.0.1:3101:3101
    volumes:
      - /opt/secretbox/data:/app/data
      - /opt/secretbox/miniprogram:/app/miniprogram:ro
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 512m
